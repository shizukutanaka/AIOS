# CI for aictl — runs the same checks the Makefile defines locally.
#
# Design notes:
# - The project itself stays stdlib-only (CLAUDE.md); PyYAML below is a
#   CI-only test dependency so tests/test_release_readiness.py can parse
#   this file strictly instead of falling back to a size check.
# - The gate's ruff and mypy steps engage only when those tools are
#   installed (aictl/cmd/gate.py treats them as optional linters and
#   reports "not installed (skipped)"). They are deliberately not
#   installed here: ruff currently reports pre-existing violations on
#   main, and the mypy --strict baseline ratchet (.mypy_baseline) is
#   calibrated to a local toolchain. Installing them in CI before that
#   debt is paid down would turn every PR red for reasons unrelated to
#   the PR. The gate step below still exercises the ratchet wiring —
#   when ruff/mypy are present it enforces zero ruff errors and the
#   mypy baseline ratchet exactly as a local run does.
# - The Go toolchain is installed in the test job as well as the go
#   job: parts of the Python suite build the real Go port, and the
#   gate has a Go port phase. Without it those checks silently degrade
#   to "unverified".

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Go (version from go-port/go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: go-port/go.mod

      - name: Install CI-only test dependencies
        run: python3 -m pip install pyyaml

      - name: Feature checks (guard-check, perf-check, sdk-check, rag-check)
        run: |
          make guard-check
          make perf-check
          make sdk-check
          make rag-check

      - name: Unit tests (full suite)
        run: python3 -m unittest discover -s tests -q

      - name: Quality gate (tests and demo already covered above)
        run: python3 -m aictl gate --skip-tests --skip-demo

  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go (version from go-port/go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: go-port/go.mod

      - name: Build, vet and test the Go port
        working-directory: go-port
        run: |
          go build ./...
          go vet ./...
          go test ./...
