# aictl Quick Start with Docker Compose
#
# Usage:
#   docker compose up -d
#   curl http://localhost:7700/v1/health
#   curl http://localhost:9999/v1/models
#
# This starts one long-lived container running `aictl demo`:
#   - aiosd daemon on :7700 (30 REST API endpoints)
#   - Mock inference engine on :9999 (OpenAI-compatible)
#
# `--host 0.0.0.0` is required and deliberate. Both servers bind loopback by
# default, which inside a container is the container's own loopback — a
# published port would reach nothing. Nothing here is authenticated, so this
# image is for local development only.

services:
  aiosd:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    # The Dockerfile's ENTRYPOINT is ["aictl"], so this is *arguments to
    # aictl*, not a shell command. It previously read
    # ["python3","-m","aictl","demo","--auto"], which ran
    # `aictl python3 -m aictl demo --auto` and exited 2 on an argparse error.
    # `demo` without --auto is the long-lived form; --auto runs the scenario
    # and exits, which for a compose service is a dead container.
    command: ["demo", "--host", "0.0.0.0"]
    ports:
      - "7700:7700"   # Daemon API
      - "9999:9999"   # Mock engine
    environment:
      - AIOS_STATE_DIR=/var/lib/aios
    volumes:
      - aios-state:/var/lib/aios
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7700/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  aios-state:
